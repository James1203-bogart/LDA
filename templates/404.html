{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}Not Found{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <h3 style="font-weight:700">Page Not Found</h3>
    <p style="color:var(--c-text-secondary)">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">
        <i class="bi bi-house-door me-2"></i>Return to Dashboard
    </a>
</div>
{% endblock %}
